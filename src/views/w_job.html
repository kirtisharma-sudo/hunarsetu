<template x-if="J && me">
  <div class="space-y-4">
    <button class="text-sm font-bold text-slate-600" @click="back()"><i class="fa-solid fa-arrow-left"></i> <span x-text="tr('Back')"></span></button>
    <section class="card space-y-3">
      <div class="flex items-start justify-between gap-2"><div><h1 class="text-xl font-extrabold" x-text="J.title"></h1><p class="text-sm text-slate-600" x-text="J.trade + ' / ' + J.location"></p></div>
        <span class="chip shrink-0" :class="appFor(J.id, me.id) ? appCls(appFor(J.id, me.id)) : 'bg-emerald-100 text-emerald-800'" x-text="appFor(J.id, me.id) ? appLabel(appFor(J.id, me.id)) : J.status"></span></div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <div class="card-flat"><div class="text-xs text-slate-500">Payment</div><b x-text="payText(J)"></b></div>
        <div class="card-flat"><div class="text-xs text-slate-500">Total for the job</div><b x-text="inr(jobTotal(J))"></b></div>
        <div class="card-flat"><div class="text-xs text-slate-500">Duration</div><b x-text="J.durationDays + ' days'"></b></div>
        <div class="card-flat"><div class="text-xs text-slate-500">Start date</div><b x-text="fdate(J.startDate)"></b></div>
        <div class="card-flat"><div class="text-xs text-slate-500">Experience needed</div><b x-text="J.minExperience + '+ years'"></b></div>
        <div class="card-flat"><div class="text-xs text-slate-500">Distance from you</div><b x-text="distKm(me.location, J.location) !== null ? distKm(me.location, J.location) + ' km' : 'Not known'"></b></div>
      </div>
      <div><p class="h-sec">Work description</p><p class="text-sm" x-text="J.description"></p></div>
      <div><p class="h-sec">Skills needed</p><div class="flex flex-wrap gap-1 mt-1"><template x-for="s in J.skills" :key="s"><span class="chip bg-slate-100 text-slate-700" x-text="skName(s)"></span></template></div></div>
      <div class="note note-warn text-sm" x-show="J.requireVerified">This job needs an Ustad-verified skill.</div>
      <div class="card-flat flex items-center gap-3"><div class="w-10 h-10 rounded-lg bg-slate-900 text-amber-400 font-black flex items-center justify-center" x-text="initials(con(J.contractorId).name)"></div>
        <div class="flex-1"><b x-text="con(J.contractorId).name"></b><div class="text-xs text-slate-500" x-text="con(J.contractorId).company + ' / ' + con(J.contractorId).location"></div></div></div>
      <p class="text-xs text-slate-500">Posted <span x-text="timeAgo(J.createdAt)"></span><span x-show="J.isDemo"> / Sample job</span></p>
    </section>

    <!-- actions -->
    <section class="space-y-2">
      <template x-if="appFor(J.id, me.id) && appFor(J.id, me.id).status==='invited'">
        <div class="grid grid-cols-2 gap-2"><button class="btn btn-green btn-lg" @click="answerInvite(appFor(J.id, me.id).id, true)"><i class="fa-solid fa-check"></i> <span x-text="tr('Accept')"></span></button><button class="btn btn-ghost btn-lg" @click="answerInvite(appFor(J.id, me.id).id, false)"><i class="fa-solid fa-xmark"></i> <span x-text="tr('Reject')"></span></button></div>
      </template>
      <template x-if="!appFor(J.id, me.id) || ['withdrawn','declined'].includes(appFor(J.id, me.id).status)">
        <div><button class="btn btn-primary btn-lg" :disabled="!workerCanApply(J, me).ok" @click="applyJob(J.id)"><i class="fa-solid fa-paper-plane"></i> <span x-text="tr('Apply')"></span></button>
          <p class="text-sm text-amber-700 font-semibold mt-1" x-show="!workerCanApply(J, me).ok" x-text="workerCanApply(J, me).why"></p></div>
      </template>
      <template x-if="appFor(J.id, me.id) && ['applied','shortlisted','accepted'].includes(appFor(J.id, me.id).status)">
        <button class="btn btn-ghost btn-lg text-red-700" @click="withdrawApp(appFor(J.id, me.id).id)">Withdraw application</button>
      </template>
      <template x-if="appFor(J.id, me.id) && appFor(J.id, me.id).status==='assigned'">
        <div class="note note-ok">You are assigned to this job. Open <button class="font-bold underline" @click="tab('w_khata')">Kaam Ka Khata</button> to send your work proof.</div>
      </template>
    </section>
  </div>
</template>
