<button class="text-sm font-bold text-slate-600" @click="back()"><i class="fa-solid fa-arrow-left"></i> <span x-text="tr('Back')"></span></button>
<section class="card space-y-3">
  <div class="flex items-center gap-3"><div class="w-14 h-14 rounded-xl bg-amber-100 text-amber-800 font-black text-xl flex items-center justify-center" x-text="initials(W.name)"></div>
    <div class="flex-1"><h1 class="text-xl font-extrabold" x-text="W.name"></h1><p class="text-sm text-slate-600" x-text="W.trade + ' / ' + W.location + ' / ' + W.experienceYears + ' yrs'"></p></div></div>
  <div class="space-y-1"><template x-for="s in W.skills" :key="s"><div class="flex items-center justify-between gap-2"><span class="font-bold" x-text="skName(s)"></span><span class="chip" :class="levelChip(skillLevel(W.id, s).level).cls" x-text="levelChip(skillLevel(W.id, s).level).en"></span></div></template></div>
  <p class="text-sm text-slate-500">Verified jobs: <b x-text="completedOf(W.id).length"></b> / Rating: <b x-text="avgRating(W.id) || '-'"></b></p>
</section>
<section class="space-y-2"><h2 class="h-sec">Assessments</h2>
  <template x-for="a in assessmentsOf(W.id)" :key="a.id"><button class="w-full text-left card-flat flex items-center gap-2" @click="openReview(a.id)"><span class="flex-1"><b x-text="skName(a.skillId)"></b><br><span class="text-xs text-slate-500" x-text="fdate(a.submittedAt)"></span></span><span class="chip" :class="asmStatusCls(a)" x-text="asmStatusLabel(a)"></span></button></template>
  <p class="text-sm text-slate-500 card-flat" x-show="!assessmentsOf(W.id).length">No assessments.</p></section>
