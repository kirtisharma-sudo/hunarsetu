<section>
  <h1 class="text-xl font-extrabold" x-text="tr('Kaam Ka Khata')"></h1>
  <p class="text-sm text-slate-600">Your work history. A job counts as verified experience only after the contractor and you have both confirmed it.</p>
</section>
<template x-if="!me"><div class="note note-warn">Create your profile on the Home tab first. <button class="font-bold underline" @click="tab('w_home')">Go to Home</button></div></template>
<template x-if="me">
  <div class="space-y-4">
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="card-flat"><div class="text-2xl font-extrabold text-emerald-700" x-text="completedOf(me.id).length"></div><div class="text-[11px] text-slate-500">Verified jobs</div></div>
      <div class="card-flat"><div class="text-2xl font-extrabold text-amber-600" x-text="recordsOfWorker(me.id).filter(r => r.status!=='completed').length"></div><div class="text-[11px] text-slate-500">In progress</div></div>
      <div class="card-flat"><div class="text-2xl font-extrabold" x-text="avgRating(me.id) || '-'"></div><div class="text-[11px] text-slate-500">Avg rating</div></div>
    </div>

    <section class="space-y-2" x-show="recordsOfWorker(me.id).filter(r => r.status!=='completed').length">
      <h2 class="h-sec">Current work</h2>
      <template x-for="r in recordsOfWorker(me.id).filter(r => r.status!=='completed')" :key="r.id">
        <button class="w-full text-left card space-y-1" @click="evReset(); go('w_record', {id: r.id})">
          <div class="flex items-start justify-between gap-2"><b x-text="r.title"></b><span class="chip shrink-0" :class="recStatusCls(r)" x-text="recStatusLabel(r)"></span></div>
          <div class="text-sm text-slate-600" x-text="con(r.contractorId).name + ' / ' + r.location + ' / ' + inr(r.agreedAmount)"></div>
        </button>
      </template>
    </section>

    <section class="space-y-2">
      <h2 class="h-sec">Verified work history</h2>
      <div class="card text-center text-slate-500" x-show="!completedOf(me.id).length"><i class="fa-solid fa-book-open text-3xl text-slate-300"></i><p class="font-bold mt-2">No verified jobs yet</p><p class="text-sm">When you finish a job and both sides confirm it, it appears here for good, even if you change contractors.</p><button class="btn btn-primary btn-sm mt-3" @click="tab('w_jobs')">Find Work</button></div>
      <ol class="relative border-l-2 border-emerald-300 ml-3 space-y-3">
        <template x-for="r in completedOf(me.id)" :key="r.id">
          <li class="ml-4">
            <span class="absolute -left-[9px] w-4 h-4 rounded-full bg-emerald-600 border-2 border-white"></span>
            <button class="w-full text-left card space-y-1" @click="go('w_record', {id: r.id})">
              <div class="flex items-start justify-between gap-2"><b x-text="r.title"></b><span class="chip bg-emerald-600 text-white shrink-0"><i class="fa-solid fa-check"></i> Verified</span></div>
              <div class="text-sm text-slate-600" x-text="con(r.contractorId).name + ' / ' + r.location"></div>
              <div class="text-xs text-slate-500" x-text="fdate(r.startDate) + ' to ' + fdate(r.endDate) + ' / ' + inr(r.agreedAmount)"></div>
              <div class="flex items-center gap-2"><span class="text-amber-500 text-xs"><template x-for="n in 5" :key="n"><i class="fa-solid fa-star" :class="n <= r.rating ? '' : 'text-slate-300'"></i></template></span><span class="chip bg-slate-100 text-slate-500" x-show="r.isDemo">Sample</span></div>
            </button>
          </li>
        </template>
      </ol>
    </section>
  </div>
</template>
