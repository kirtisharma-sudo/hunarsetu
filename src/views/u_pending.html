<section><h1 class="text-xl font-extrabold" x-text="tr('Pending Assessments')"></h1>
  <p class="text-sm text-slate-600">Skill videos waiting for your decision. Open one to watch it and respond.</p></section>
<div class="card text-center text-slate-500" x-show="!ustadQueue().length"><i class="fa-solid fa-inbox text-3xl text-slate-300"></i><p class="font-bold mt-2">No pending assessments</p></div>
<template x-for="a in ustadQueue()" :key="a.id">
  <article class="card space-y-2">
    <div class="flex items-start justify-between gap-2"><div><b x-text="wk(a.workerId).name"></b><div class="text-sm text-slate-600" x-text="wk(a.workerId).trade + ' / ' + wk(a.workerId).experienceYears + ' yrs / ' + wk(a.workerId).location"></div></div><span class="chip" :class="asmStatusCls(a)" x-text="asmStatusLabel(a)"></span></div>
    <div class="flex flex-wrap gap-1"><span class="chip bg-slate-100 text-slate-700" x-text="skName(a.skillId)"></span><span class="chip bg-slate-100 text-slate-500" x-show="a.sample">Sample record</span><span class="chip bg-slate-100 text-slate-500" x-text="'Sent ' + timeAgo(a.submittedAt)"></span></div>
    <button class="btn btn-primary btn-lg" @click="openReview(a.id)"><i class="fa-solid fa-play"></i> Open and review</button>
  </article>
</template>
<section class="space-y-2" x-show="db.support_requests.some(s => s.type==='assessment_appointment' && s.ustadId===ustad.id)">
  <h2 class="h-sec">Practical tests booked for you</h2>
  <template x-for="s in db.support_requests.filter(s => s.type==='assessment_appointment' && s.ustadId===ustad.id)" :key="s.id"><div class="card-flat text-sm"><b x-text="wk(s.workerId) && wk(s.workerId).name"></b> / <span x-text="fdate(s.date) + ' / ' + s.place"></span></div></template>
</section>
