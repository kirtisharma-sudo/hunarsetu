<!-- Shared payment detail. `payBy` is 'worker' or 'contractor'. -->
<section class="card space-y-3 form-narrow">
  <div><h2 class="text-lg font-extrabold" x-text="R.title"></h2>
    <p class="text-sm text-slate-600" x-text="(wk(R.workerId)||{}).name + ' / ' + (con(R.contractorId)||{}).name"></p></div>
  <template x-if="payTotals(R.id)">
    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div class="card-flat"><div class="text-xs text-slate-500" x-text="tr('Agreed amount')"></div><div class="text-xl font-extrabold" x-text="inr(payTotals(R.id).agreed)"></div></div>
        <div class="card-flat"><div class="text-xs text-slate-500" x-text="tr('Advance')"></div><div class="text-xl font-extrabold" x-text="inr(payTotals(R.id).advance)"></div></div>
        <div class="card-flat"><div class="text-xs text-slate-500" x-text="tr('Paid') + ' (' + (lang==='hi' ? 'अतिरिक्त' : 'additional') + ')'"></div><div class="text-xl font-extrabold" x-text="inr(payTotals(R.id).paid)"></div></div>
        <div class="rounded-xl p-3" :class="payTotals(R.id).outstanding>0 ? 'bg-amber-100' : 'bg-emerald-100'"><div class="text-xs text-slate-600" x-text="tr('Outstanding')"></div><div class="text-xl font-extrabold" x-text="inr(payTotals(R.id).outstanding)"></div></div>
      </div>
      <div class="flex items-center justify-between"><span class="chip" :class="payTotals(R.id).cls" x-text="payTotals(R.id).status"></span>
        <span class="text-sm text-slate-600" x-show="payTotals(R.id).dueDate">Due <b x-text="fdate(payTotals(R.id).dueDate)"></b></span></div>
      <div class="note note-info text-xs" x-show="payTotals(R.id).unconfirmed > 0">Of the money recorded, <b x-text="inr(payTotals(R.id).unconfirmed)"></b> still needs the other person to confirm.</div>
      <div x-show="payBy==='contractor'"><label class="lbl" for="due">Payment due date</label><input id="due" type="date" class="inp" :value="payTotals(R.id).dueDate" @change="setDue(R.id, $event.target.value)"></div>
    </div>
  </template>
</section>

<section class="card space-y-2">
  <h3 class="h-sec">Entries</h3>
  <p class="text-sm text-slate-500" x-show="!payOf(R.id).entries.length">Nothing recorded yet.</p>
  <template x-for="e in payOf(R.id).entries" :key="e.id">
    <div class="card-flat space-y-2" :class="e.disputed && 'opacity-60'">
      <div class="flex items-start justify-between gap-2">
        <div><b class="text-lg" x-text="inr(e.amount)"></b> <span class="chip bg-slate-100 text-slate-700" x-text="e.kind==='advance' ? 'Advance' : 'Payment'"></span>
          <div class="text-xs text-slate-500" x-text="fdate(e.date) + ' / noted by ' + e.by + (e.note ? ' / ' + e.note : '')"></div></div>
        <span class="chip shrink-0" :class="entryCls(e)" x-text="entryLabel(e)"></span>
      </div>
      <div class="flex flex-wrap gap-2" x-show="!e.disputed">
        <button class="btn btn-green btn-sm" x-show="payBy==='worker' ? !e.confirmedWorker : !e.confirmedContractor" @click="confirmPay(R.id, e.id, payBy)"><i class="fa-solid fa-check"></i> Yes, this is correct</button>
        <button class="btn btn-ghost btn-sm text-red-700" x-show="!(payBy==='worker' ? e.confirmedWorker && e.by==='worker' : e.confirmedContractor && e.by==='contractor') || true" @click="disputePay(R.id, e.id, payBy)"><i class="fa-solid fa-flag"></i> This is wrong</button>
        <button class="btn btn-ghost btn-sm" x-show="e.by===payBy && !(payBy==='worker' ? e.confirmedContractor : e.confirmedWorker)" @click="delPay(R.id, e.id, payBy)"><i class="fa-solid fa-trash"></i> Delete</button>
      </div>
    </div>
  </template>
</section>

<section class="card space-y-3">
  <h3 class="h-sec">Add an entry</h3>
  <div class="flex gap-2"><button class="pick flex-1 justify-center" :class="payF.kind==='advance' && 'pick-on'" @click="payF.kind='advance'">Advance</button><button class="pick flex-1 justify-center" :class="payF.kind==='payment' && 'pick-on'" @click="payF.kind='payment'">Payment</button></div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="lbl" for="pamt">Amount (Rs.)</label><input id="pamt" class="inp" type="number" inputmode="numeric" min="1" x-model="payF.amount"><p class="err" x-show="errs.amount" x-text="errs.amount"></p></div>
    <div><label class="lbl" for="pdate">Date</label><input id="pdate" class="inp" type="date" :max="todayMax()" x-model="payF.date"><p class="err" x-show="errs.date" x-text="errs.date"></p></div>
  </div>
  <div><label class="lbl" for="pnote">Note (optional)</label><input id="pnote" class="inp" maxlength="120" placeholder="Cash, UPI, part payment..." x-model="payF.note"></div>
  <button class="btn btn-dark btn-lg" @click="addPay(R.id, payBy)"><i class="fa-solid fa-plus"></i> Add entry</button>
</section>

<div class="note note-warn text-sm"><b>Please note.</b> HunarSetu only records what the worker and contractor agreed and what has been paid. It does not hold money, guarantee payment or act as escrow. If there is a dispute, talk to the other person or ask a Hunar Mitra for help.</div>
