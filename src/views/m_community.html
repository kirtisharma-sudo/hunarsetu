<section><h1 class="text-xl font-extrabold" x-text="tr('Community')"></h1><p class="text-sm text-slate-600">Workers near <span x-text="mitra.location"></span> and local announcements.</p></section>

<section class="card space-y-3">
  <h2 class="h-sec">Post an announcement</h2>
  <div><label class="lbl" for="an_t">Title</label><input id="an_t" class="inp" x-model="postF.title"><p class="err" x-show="errs.title" x-text="errs.title"></p></div>
  <div><label class="lbl" for="an_x">Details</label><textarea id="an_x" rows="3" class="inp" x-model="postF.text"></textarea><p class="err" x-show="errs.text" x-text="errs.text"></p></div>
  <div><label class="lbl" for="an_d">Date (optional)</label><input id="an_d" type="date" class="inp" x-model="postF.date"></div>
  <button class="btn btn-dark btn-lg" @click="postAnnouncement()"><i class="fa-solid fa-bullhorn"></i> Post</button>
</section>

<section class="space-y-2"><h2 class="h-sec">Announcements</h2>
  <div class="card text-center text-slate-500" x-show="!db.community.length">None yet.</div>
  <template x-for="c in db.community" :key="c.id"><article class="card space-y-1"><div class="flex items-start justify-between gap-2"><b x-text="c.title"></b><button class="text-slate-400" x-show="c.mitraId===mitra.id" @click="delAnnouncement(c.id)" aria-label="Delete announcement"><i class="fa-solid fa-trash"></i></button></div><p class="text-sm" x-text="c.text"></p><p class="text-xs text-slate-500" x-text="(c.date ? fdate(c.date) + ' / ' : '') + 'Posted ' + timeAgo(c.createdAt)"></p></article></template></section>

<section class="space-y-2"><h2 class="h-sec">Worker directory near me (public details only)</h2>
  <template x-for="w in nearbyWorkers()" :key="w.id"><div class="card-flat flex items-center gap-2"><span class="w-9 h-9 rounded-lg bg-amber-100 text-amber-800 font-black flex items-center justify-center" x-text="initials(w.name)"></span><span class="flex-1"><b x-text="w.name"></b><br><span class="text-xs text-slate-500" x-text="w.trade + ' / ' + w.location + ' / ' + distKm(w.location, mitra.location) + ' km'"></span></span><span class="chip" :class="availCls(w)" x-text="availLabel(w)"></span></div></template>
  <p class="text-xs text-slate-500">Phone numbers and payment details are not shown here.</p></section>
