<section><h1 class="text-xl font-extrabold" x-text="tr('Work History')"></h1><p class="text-sm text-slate-600">All jobs you assigned. Confirm completed work here so it becomes part of the worker's record.</p></section>
<div class="card text-center text-slate-500" x-show="!myRecords().length"><i class="fa-solid fa-clock-rotate-left text-3xl text-slate-300"></i><p class="font-bold mt-2">No jobs assigned yet</p><p class="text-sm">Accept an application and assign the job to start a work record.</p><button class="btn btn-primary btn-sm mt-3" @click="tab('c_apps')">Go to Applications</button></div>
<template x-for="r in myRecords()" :key="r.id">
  <button class="w-full text-left card space-y-1" @click="cf={rating:0,feedback:'',correction:''}; errs={}; go('c_record', {id: r.id})">
    <div class="flex items-start justify-between gap-2"><b x-text="r.title"></b><span class="chip shrink-0" :class="recStatusCls(r)" x-text="recStatusLabel(r)"></span></div>
    <div class="text-sm text-slate-600" x-text="wk(r.workerId).name + ' / ' + r.location + ' / ' + inr(r.agreedAmount)"></div>
    <div class="text-xs font-bold text-amber-700" x-show="r.status==='evidence_submitted'"><i class="fa-solid fa-bell"></i> Waiting for your confirmation</div>
  </button>
</template>
