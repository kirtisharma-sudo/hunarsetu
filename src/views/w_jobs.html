<section class="space-y-1">
  <h1 class="text-xl font-extrabold" x-text="tr('Find Work')"></h1>
  <p class="text-sm text-slate-600">Jobs posted by contractors. Sorted by how well they match your trade, distance and experience.</p>
</section>

<template x-if="!me"><div class="note note-warn">Create your profile on the Home tab first, so contractors can see who is applying. <button class="font-bold underline" @click="tab('w_home')">Go to Home</button></div></template>

<template x-if="me">
  <div class="space-y-4">
    <!-- Invitations -->
    <section class="space-y-2" x-show="myApps().filter(a => a.status==='invited').length">
      <h2 class="h-sec">Invitations for you</h2>
      <template x-for="a in myApps().filter(a => a.status==='invited')" :key="a.id">
        <div class="card border-amber-300 bg-amber-50 space-y-2">
          <div><b x-text="jb(a.jobId).title"></b><div class="text-sm text-slate-600" x-text="con(jb(a.jobId).contractorId).name + ' / ' + jb(a.jobId).location"></div><div class="text-sm font-bold" x-text="payText(jb(a.jobId))"></div></div>
          <div class="grid grid-cols-3 gap-2">
            <button class="btn btn-green btn-sm col-span-1" @click="answerInvite(a.id, true)"><i class="fa-solid fa-check"></i> <span x-text="tr('Accept')"></span></button>
            <button class="btn btn-ghost btn-sm" @click="answerInvite(a.id, false)"><i class="fa-solid fa-xmark"></i> <span x-text="tr('Reject')"></span></button>
            <button class="btn btn-ghost btn-sm" @click="go('w_job', {id: a.jobId})">Details</button>
          </div>
        </div>
      </template>
    </section>

    <!-- Filters -->
    <section class="card space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl" for="jf_t">Trade</label><select id="jf_t" class="inp" x-model="jobF.trade"><option value="">All trades</option><template x-for="t in TRADES" :key="t"><option :value="t" x-text="t"></option></template></select></div>
        <div><label class="lbl" for="jf_k">Distance</label><select id="jf_k" class="inp" x-model="jobF.maxKm"><option value="">Any</option><option value="10">Within 10 km</option><option value="20">Within 20 km</option><option value="40">Within 40 km</option></select></div>
      </div>
    </section>

    <!-- List -->
    <section class="space-y-3">
      <div class="card text-center text-slate-500" x-show="!openJobsForWorker().length"><i class="fa-solid fa-briefcase text-3xl text-slate-300"></i><p class="font-bold mt-2">No jobs match</p><p class="text-sm">Try another trade or distance.</p></div>
      <template x-for="j in openJobsForWorker()" :key="j.id">
        <article class="card space-y-2">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0"><h3 class="font-extrabold text-base" x-text="j.title"></h3>
              <p class="text-sm text-slate-600"><i class="fa-solid" :class="TRADE_ICON[j.trade]"></i> <span x-text="j.trade"></span> / <span x-text="j.location"></span><span x-show="j.fit.dist !== null"> / <b x-text="j.fit.dist + ' km'"></b></span></p></div>
            <span class="chip shrink-0" :class="appFor(j.id, me.id) ? appCls(appFor(j.id, me.id)) : 'bg-emerald-100 text-emerald-800'" x-text="appFor(j.id, me.id) ? appLabel(appFor(j.id, me.id)) : (j.status==='open' ? 'Open' : 'Closed')"></span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center text-sm">
            <div class="card-flat"><div class="text-[10px] text-slate-500">Pay</div><b x-text="inr(j.amount)"></b><div class="text-[10px] text-slate-500" x-text="j.payType==='daily' ? 'per day' : 'fixed'"></div></div>
            <div class="card-flat"><div class="text-[10px] text-slate-500">Duration</div><b x-text="j.durationDays + (j.durationDays===1 ? ' day' : ' days')"></b></div>
            <div class="card-flat"><div class="text-[10px] text-slate-500">Experience</div><b x-text="j.minExperience + '+ yrs'"></b></div>
          </div>
          <ul class="text-xs text-slate-600 space-y-0.5"><template x-for="r in j.fit.reasons" :key="r"><li><i class="fa-solid fa-check text-emerald-600 mr-1"></i><span x-text="r"></span></li></template></ul>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn btn-ghost" @click="go('w_job', {id: j.id})">View details</button>
            <button class="btn btn-primary" x-show="!appFor(j.id, me.id) || ['withdrawn','declined'].includes(appFor(j.id, me.id).status)" :disabled="!workerCanApply(j, me).ok" @click="applyJob(j.id)"><span x-text="tr('Apply')"></span></button>
          </div>
          <p class="text-xs text-amber-700 font-semibold" x-show="!workerCanApply(j, me).ok && j.status==='open'" x-text="workerCanApply(j, me).why"></p>
        </article>
      </template>
    </section>

    <!-- My applications -->
    <section class="space-y-2" x-show="myApps().filter(a => a.status!=='invited').length">
      <h2 class="h-sec">My applications</h2>
      <template x-for="a in myApps().filter(a => a.status!=='invited')" :key="a.id">
        <button class="w-full text-left card-flat flex items-center gap-2 min-h-[52px]" @click="go('w_job', {id: a.jobId})"><span class="flex-1 min-w-0"><b class="block truncate" x-text="jb(a.jobId).title"></b><span class="text-xs text-slate-500" x-text="timeAgo(a.updatedAt)"></span></span><span class="chip" :class="appCls(a)" x-text="appLabel(a)"></span></button>
      </template>
    </section>
  </div>
</template>
